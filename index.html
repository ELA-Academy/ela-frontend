<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/ela-app-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#673de6" />
    <link rel="apple-touch-icon" href="/images/ela-app-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>ELA Academy Management System</title>
    <script>
      // Self-healing for chunk loading errors (e.g. after a new production deployment)
      window.addEventListener('error', function (e) {
        var msg = e && e.message ? String(e.message) : '';
        var isChunkError =
          msg.indexOf('Loading chunk') !== -1 ||
          msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
          msg.indexOf('Unexpected token \'<\'') !== -1 ||
          (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK'));

        if (isChunkError) {
          var reloadKey = 'chunk_reload_lock';
          var lastReload = sessionStorage.getItem(reloadKey);
          var now = Date.now();
          if (!lastReload || now - parseInt(lastReload, 10) > 15000) {
            sessionStorage.setItem(reloadKey, String(now));
            window.location.reload();
          }
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
